<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color :#f2f2f2; /*missing :*/
        }

        #student-title { /*student title is a ID and # is needed to add css on ID where here . is used but . is for class*/
            text-align: center;
            color: darkblue;
        }

        #studentForm { /*student Form is a ID and # is needed to add css on ID*/
            width: 450px;
            border: 2px solid black;
            padding : 20px; /*= instead of : */
            margin: 20px auto;
        }

        .input-box {
            margin-bottom: 12px;
        }

        #resultBox {
            width: 450px;
            border: 1px solid green;
            padding: 15px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1 id="student-title">Student Registration Form</h1>

<form id="studentForm">

    <div class="input-box">
        <label for="studentName">Student Name:</label>
        <!--change the ID studentname to studentName and added required-->
        <input type="text" id="studentName" required>
    </div>

    <div class="input-box">
        <label for="email">Email:</label>
        <!--type should be email not text and added required-->
        <input type="email" id="email" required>
    </div>

    <div class="input-box">
        <label for="mobile">Mobile Number:</label>
        <input type="number" id="mobile">
    </div>

    <div class="input-box">
        <label for="dob">Date of Birth:</label>
        <!--type should be date not text-->
        <input type="date" id="dob">
    </div>

    <div class="input-box">
        <label for="course">Course:</label>

        <!--Added Required-->
        <select id="course" required>
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BTech">B.Tech</option>
        </select>
    </div>

    <div class="input-box">
        <label>Expertise:</label>

        <input type="checkbox" id="html" value="HTML"> HTML
        <input type="checkbox" id="css" value="CSS"> CSS
        <input type="checkbox" id="js" value="JavaScript"> JavaScript
    </div>

    <!--parameter event-->
    <button type="submit" onclick="submitStudent(event)">
        Register Student
    </button>

</form>

<div id="resultBox">
    Registration information will appear here.
</div>

<script>

function submitStudent(event) { /*Renamed the function as function called submitStudent()*/
    event.preventDefault();

    var name =
        document.getElementById("studentName").value;

    let email =
        document.getElementById("email").value;

    const mobile =
        document.getElementById("mobile").value;

    let dob =
        document.getElementById("dob").value;

    var course =
        document.getElementById("course").value;

    // Validate required fields and changed to || 
    if (name === "" || email === "" || course === "") {
        alert("Student Name, Email and Course are required");
        return;
    }

    
    // Get and validate semester
    var semester = prompt("Enter Current Semester");

    if (semester === null || semester.trim() === "") {
        alert("Valid semester is required");
        return;
    }

    semester = semester.trim();

    // Check expertise
    var expertise = [];

    if (document.getElementById("html").checked) {
        expertise.push(document.getElementById("html").value);
    }

    if (document.getElementById("css").checked) {
        expertise.push(document.getElementById("css").value);
    }

    if (document.getElementById("js").checked) {
        expertise.push(document.getElementById("js").value);
    }

    if (expertise.length === 0) {
        alert("Please select at least one expertise");
        return;
    }

    var choice =
        confirm("Do you want to submit the registration?"); //changed msg from cancel to submit

    // Changed: Registration result and success message are shown only when user selects OK.
    if (choice === true) {

        //Changed it to document.getElementById("resultBox").innerHTML.
        document.getElementById("resultBox").innerHTML =
            "<h2>Student Information</h2>" +
            "Name: " + name +
            "<br>Email: " + email +
            "<br>Mobile: " + mobile +
            "<br>DOB: " + dob +
            "<br>Course: " + course +
            "<br>Semester: " + semester +
            // Changed: Added selected expertise to the registration result.
            "<br>Expertise: " + expertise.join(", ");

        alert("Registration successful");
    }

}

</script>

</body>
</html>
