<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color :#f2f2f2; /*missing :*/
        }

        #student-title { /*student title is a ID and # is needed to add css on ID where here . is used but . is for class*/
            text-align: center;
            color: darkblue;
        }

        #studentForm { /*student Form is a ID and # is needed to add css on ID*/
            width: 450px;
            border: 2px solid black;
             padding : 20px; /*= instead of : */
            margin: 20px auto;
        }

        .input-box {
            margin-bottom: 12px;
        }

        #resultBox {
            width: 450px;
            border: 1px solid green;
            padding: 15px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h1 id="student-title">Student Registration Form</h1>

<form id="studentForm">

    <div class="input-box">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required>/*change the ID studentname to studentName and added required*/
    </div>

    <div class="input-box">
        <label for="email">Email:</label>
        <input type="email" id="email" required> /*type should be email not text and added required */
    </div>

    <div class="input-box">
        <label for="mobile">Mobile Number:</label>
        <input type="number" id="mobile">
    </div>

    <div class="input-box">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">/*type should be date not text */
    </div>

    <div class="input-box">
        <label for="course">Course:</label>

        <select id="course" required>/*Added Required*/
            <option value="">Select Course</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BTech">B.Tech</option>
        </select>
    </div>

    <div class="input-box">
        <label>Expertise:</label>

        <input type="checkbox" id="html" value="HTML"> HTML
        <input type="checkbox" id="css" value="CSS"> CSS
        <input type="checkbox" id="js" value="JavaScript"> JavaScript
    </div>

    <button type="submit" onclick="submitStudent()">
        Register Student
    </button>

</form>

<div id="resultBox">
    Registration information will appear here.
</div>

<script>

function submitStudent() { /*Renamed the function as function called submitStudent()*/

    var name =
        document.getElementById("studentName").value;

    let email =
        document.getElementById("email").value;

    const mobile =
        document.getElementById("mobile").value;

    let dob =
        document.getElementById("dob").value;

    var course =
        document.getElementById("course").value;

    // Validate required fields
    if (name === "" || email === "" || course === "") {
        alert("Student Name, Email and Course are required");
        return;
    }

    var semester =
        prompt("Enter Current Semester");

    if (semester == "") {
        alert("Semester not entered");
    }

    var choice =
        confirm("Do you want to submit the registration?"); //changed msg from cancel to submit

    if (choice == true) {
        alert("Registration successful");
    }

//Changed it to document.getElementById("resultBox").innerHTML.
    document.getElementById("resultBox").innerHTML =
        "<h2>Student Information</h2>" +
        "Name: " + name +
        "<br>Email: " + email +
        "<br>Mobile: " + mobile +
        "<br>DOB: " + dob +
        "<br>Course: " + course +
        "<br>Semester: " + semester;

}

</script>

</body>
</html>
